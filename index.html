<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal App</title>
    <style>
        /* Basis- und Layout-Styles im dunklen, minimalistischen Stil */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 60px 20px;
            overflow-x: hidden;
        }

        /* Haupt-Header-Bereich */
        .hero-section {
            text-align: center;
            margin-bottom: 60px;
            max-width: 600px;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.03em;
        }

        /* Grüner Installations-Button */
        .install-btn {
            display: inline-block;
            background-color: #22c55e;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 48px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .install-btn:hover {
            background-color: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(34, 197, 94, 0.4);
        }

        .install-btn:active {
            transform: translateY(0);
        }

        /* Sektion für die App-Vorschau */
        .screenshot-section {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #888888;
            margin-bottom: 30px;
        }

        /* Container für das statische Screenshot-Bild */
        .screenshot-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid #222222;
            background-color: #11111b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-screenshot {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header class="hero-section">
        <h1 class="hero-title">Terminal</h1>
        <a href="https://github.com/Shadowniko1/terminal/releases/download/terminal/terminal.zip" class="install-btn">INSTALL</a>
    </header>

    <main class="screenshot-section">
        <h2 class="section-title">App Screenshots</h2>
        
        <div class="screenshot-container">
            <img src="screenshot.png" alt="App Screenshot" class="app-screenshot">
        </div>
    </main>

</body>
</html>
